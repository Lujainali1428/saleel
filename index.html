<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="صليل">
<link rel="apple-touch-icon" id="appIcon">
<title>صليل</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --dark-brown: #2c1a0e;
  --mid-brown: #4a2e1a;
  --warm-brown: #7a4a28;
  --tan: #c4a882;
  --cream: #f0e6d0;
  --parchment: #f5ecd8;
  --gold: #c9924a;
  --text-dark: #2c1a0e;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Amiri',serif; background:var(--dark-brown); overflow-x:hidden; }

/* ===== LIBRARY BG ===== */
.lib-bg {
position:fixed; inset:0; z-index:0; overflow:hidden;
background: #1a0a04;
}
.books-left, .books-right {
position:absolute; top:0; bottom:0; width:22%;
display:flex; flex-direction:column;
}
.books-left { left:0; }
.books-right { right:0; }
.floor {
position:absolute; bottom:0; left:50%; transform:translateX(-50%);
width:56%; height:28%;
background: linear-gradient(180deg, #c4956a, #7a5030);
clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
}
.ceiling-light {
position:absolute; top:5%; left:50%; transform:translateX(-50%);
width:180px; height:14px;
background:rgba(255,240,180,0.25);
border-radius:50%;
box-shadow: 0 0 80px 40px rgba(255,220,120,0.15), 0 0 160px 100px rgba(255,200,80,0.08);
}

/* ===== PAGES ===== */
.page { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; }
.page.active { display:flex; }

/* ===== SPLASH PAGE ===== */
#splashPage {
align-items:center; justify-content:center;
background:transparent;
}
.splash-logo {
width: min(85vw, 400px);
height: auto;
filter: drop-shadow(0 10px 40px rgba(0,0,0,0.8));
animation: logoFloat 5s ease-in-out infinite;
cursor: pointer;
}
@keyframes logoFloat {
0%,100%{transform:translateY(0)}
50%{transform:translateY(-14px)}
}
.splash-tap {
color:rgba(196,168,130,0.6);
font-family:‘Scheherazade New’,serif;
font-size:1.1rem;
margin-top:30px;
animation:pulse 2s infinite;
letter-spacing:3px;
}
@keyframes pulse {
0%,100%{opacity:0.4} 50%{opacity:1}
}

/* ===== MENU PAGE ===== */
#menuPage { background:transparent; }
.menu-header {
padding:20px;
text-align:center;
border-bottom:1px solid rgba(196,168,130,0.2);
background:rgba(20,8,2,0.6);
}
.menu-logo-small {
width:100px; height:auto;
filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
}
.menu-content {
flex:1; overflow-y:auto; padding:24px 20px;
background:rgba(20,8,2,0.4);
}
.menu-title {
font-family:‘Scheherazade New’,serif;
color:var(–tan);
font-size:1.6rem;
font-weight:700;
text-align:center;
margin-bottom:6px;
letter-spacing:3px;
}
.menu-sub {
color:rgba(196,168,130,0.5);
font-size:0.9rem;
text-align:center;
margin-bottom:24px;
font-style:italic;
}
.gold-line {
width:120px; height:1px;
background:linear-gradient(90deg,transparent,var(–gold),transparent);
margin:0 auto 28px;
}

.ghazwa-card {
background:#f5ecd8;
border-radius:12px;
margin-bottom:16px;
overflow:hidden;
box-shadow:0 4px 20px rgba(0,0,0,0.5);
border:1px solid rgba(201,146,74,0.3);
cursor:pointer;
transition:transform 0.3s, box-shadow 0.3s;
position:relative;
}
.ghazwa-card:hover { transform:translateY(-4px); box-shadow:0 12px 40px rgba(0,0,0,0.6); }

/* Torn top edge */
.ghazwa-card::before {
content:’’; position:absolute; top:-6px; left:10px; right:10px; height:12px;
background:var(–parchment);
clip-path:polygon(0% 100%,2% 40%,5% 80%,8% 20%,11% 70%,14% 30%,17% 75%,20% 15%,25% 65%,30% 35%,35% 80%,40% 20%,45% 70%,50% 10%,55% 70%,60% 35%,65% 80%,70% 20%,75% 65%,80% 30%,85% 75%,88% 15%,91% 70%,94% 40%,97% 75%,100% 50%,100% 100%);
}

.card-inner { padding:20px 22px 18px; }
.card-number {
font-family:‘Scheherazade New’,serif;
font-size:0.8rem;
color:var(–gold);
letter-spacing:2px;
margin-bottom:4px;
}
.card-name {
font-family:‘Scheherazade New’,serif;
font-size:1.6rem;
font-weight:700;
color:var(–mid-brown);
margin-bottom:6px;
}
.card-year {
font-size:0.9rem;
color:#7a6050;
margin-bottom:12px;
}
.card-desc {
font-size:0.95rem;
color:#4a3020;
line-height:1.8;
}
.card-arrow {
position:absolute;
left:18px; top:50%;
transform:translateY(-50%);
color:var(–gold);
font-size:1.4rem;
}

/* ===== STORY PAGE ===== */
#storyPage { background:transparent; overflow:hidden; }
.story-header {
padding:14px 16px;
display:flex;
align-items:center;
gap:12px;
border-bottom:1px solid rgba(196,168,130,0.2);
background:rgba(20,8,2,0.5);
}
.back-btn {
background:transparent;
border:1px solid var(–gold);
color:var(–tan);
font-family:‘Amiri’,serif;
font-size:0.95rem;
padding:6px 14px;
border-radius:4px;
cursor:pointer;
transition:all 0.2s;
white-space:nowrap;
}
.back-btn:hover { background:var(–gold); color:var(–dark-brown); }
.story-header-title {
font-family:‘Scheherazade New’,serif;
color:var(–tan);
font-size:1.2rem;
font-weight:700;
flex:1;
text-align:center;
}

.story-content { flex:1; overflow-y:auto; padding:20px 16px 40px; }

.parchment-section {
background:var(–parchment);
border-radius:10px;
padding:24px 20px;
margin-bottom:20px;
box-shadow:0 4px 20px rgba(0,0,0,0.4);
border:1px solid rgba(201,146,74,0.25);
position:relative;
}
.parchment-section::before {
content:’’; position:absolute; top:-6px; left:10px; right:10px; height:12px;
background:var(–parchment);
clip-path:polygon(0% 100%,2% 40%,5% 80%,8% 20%,11% 70%,14% 30%,17% 75%,20% 15%,25% 65%,30% 35%,35% 80%,40% 20%,45% 70%,50% 10%,55% 70%,60% 35%,65% 80%,70% 20%,75% 65%,80% 30%,85% 75%,88% 15%,91% 70%,94% 40%,97% 75%,100% 50%,100% 100%);
}

.section-title {
font-family:‘Scheherazade New’,serif;
font-size:1.8rem;
font-weight:700;
color:var(–mid-brown);
text-align:center;
margin-bottom:14px;
}
.ornament {
text-align:center;
color:var(–gold);
font-size:1rem;
letter-spacing:8px;
margin-bottom:16px;
}
.story-text {
font-size:1.05rem;
line-height:2.1;
color:#2c1a0e;
text-align:justify;
}
.story-text p { margin-bottom:14px; }

.quiz-section {
background:var(–parchment);
border-radius:10px;
padding:20px;
box-shadow:0 4px 20px rgba(0,0,0,0.4);
border:1px solid rgba(201,146,74,0.25);
}
.quiz-title {
font-family:‘Scheherazade New’,serif;
font-size:1.4rem;
font-weight:700;
color:var(–mid-brown);
text-align:center;
margin-bottom:20px;
}
.q-block { margin-bottom:22px; }
.q-text {
font-family:‘Scheherazade New’,serif;
font-size:1.05rem;
font-weight:700;
color:#2c1a0e;
margin-bottom:12px;
line-height:1.7;
}
.answers { display:flex; flex-direction:column; gap:8px; }
.ans-btn {
padding:10px 16px;
border:1.5px solid rgba(120,80,30,0.3);
background:white;
border-radius:6px;
font-family:‘Amiri’,serif;
font-size:1rem;
cursor:pointer;
transition:all 0.2s;
text-align:right;
color:#2c1a0e;
}
.ans-btn:hover { border-color:var(–warm-brown); background:#fdf5e8; }
.ans-btn.correct { background:#e0f0d8; border-color:#5a8040; color:#1a4010; font-weight:700; }
.ans-btn.wrong { background:#f8e0dc; border-color:#9a4030; color:#4a1010; }
.ans-btn:disabled { cursor:default; }
.feedback {
display:none; margin-top:8px; padding:8px 14px;
border-radius:6px; font-weight:700; font-size:0.95rem; text-align:center;
}
.feedback.show { display:block; }
.feedback.correct { background:#e0f0d8; color:#1a4010; }
.feedback.wrong { background:#f8e0dc; color:#4a1010; }
.score-box {
display:none; text-align:center; padding:16px;
background:linear-gradient(135deg,var(–mid-brown),var(–dark-brown));
border-radius:8px; color:var(–tan);
font-family:‘Scheherazade New’,serif;
font-size:1.2rem; font-weight:700; margin-top:16px;
border:1px solid var(–gold);
}
.score-box.show { display:block; }

@keyframes fadeUp {
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}
.page.active .parchment-section,
.page.active .quiz-section,
.page.active .ghazwa-card { animation:fadeUp 0.4s ease both; }
</style>

</head>
<body>

<!-- LIBRARY BACKGROUND -->

<div class="lib-bg">
  <div class="books-left" id="shelfLeft"></div>
  <div class="books-right" id="shelfRight"></div>
  <div class="floor"></div>
  <div class="ceiling-light"></div>
</div>

<!-- ===== SPLASH PAGE ===== -->

<div class="page active" id="splashPage">
  <img class="splash-logo" id="splashLogo" src="" alt="صليل">
  <p class="splash-tap" onclick="goToMenu()" style="cursor:pointer;font-size:1.3rem;padding:16px 30px;border:1px solid rgba(196,168,130,0.4);border-radius:6px;margin-top:20px;">✦ اضغط للدخول ✦</p>
</div>

<!-- ===== MENU PAGE ===== -->

<div class="page" id="menuPage">
  <div class="menu-header">
    <img class="menu-logo-small" id="menuLogo" src="" alt="صليل">
  </div>
  <div class="menu-content">
    <h2 class="menu-title">الغزوات</h2>
    <p class="menu-sub">اختر غزوة واقرأ قصتها</p>
    <div class="gold-line"></div>

```
<div class="ghazwa-card" onclick="openStory(0)">
  <div class="card-inner">
    <div class="card-number">الغزوة الأولى ✦</div>
    <div class="card-name">غزوة بدر الكبرى</div>
  </div>
  <span class="card-arrow">←</span>
</div>

<div class="ghazwa-card" onclick="openStory(1)">
  <div class="card-inner">
    <div class="card-number">الغزوة الثانية ✦</div>
    <div class="card-name">غزوة أُحد</div>
  </div>
  <span class="card-arrow">←</span>
</div>
```

  </div>
</div>

<!-- ===== STORY PAGE ===== -->

<div class="page" id="storyPage">
  <div class="story-header">
    <button class="back-btn" onclick="goToMenu()">→ القائمة</button>
    <div class="story-header-title" id="storyHeaderTitle"></div>
  </div>
  <div class="story-content" id="storyContent"></div>
</div>

<script>
// ===== DATA =====
const stories = [
  {
    title: "غزوة بدر الكبرى",
    year: "السنة الثانية من الهجرة",
    text: `<p>في السنة الثانية من الهجرة وقعت غزوة بدر، وهي أول معركة فاصلة بين المسلمين والمشركين.</p>
<p>خرج النبي محمد ﷺ مع أصحابه رضي الله عنهم لاعتراض قافلة قريش، لكن الأمر تطوّر إلى مواجهة كبيرة مع جيش قريش الذي جاء بقيادة كبار زعمائهم.</p>
<p>كان عدد المسلمين قليلًا (حوالي ثلاثمائة وبضعة عشر رجلًا)، لكنهم كانوا أقوياء بالإيمان والثقة بالله. أما جيش قريش فكان أكبر بكثير ويضم رؤوس الكفر من زعمائهم الذين عذبوا المسلمين وآذوهم في مكة.</p>
<p>قبل المعركة، ثبّت الله قلوب المؤمنين، وأيّدهم بنصرٍ عظيم، ومن ذلك أن الله أنزل الملائكة لمساندتهم: ألف ملك في البداية، ثم ثلاثة آلاف، وقد يزاد إلى خمسة آلاف من الملائكة المعلَّمين.</p>
<p>أهم رؤوس المشركين الذين قُتلوا في بدر: أبو جهل، عتبة بن ربيعة، شيبة بن ربيعة، الوليد بن عتبة، وأمية بن خلف.</p>
<p>انتهت المعركة بنصرٍ عظيم للمسلمين رغم قلة عددهم، وكان درسًا واضحًا أن النصر من عند الله، وأن القوة الحقيقية هي الإيمان والثبات، لا العدد ولا العدة.</p>`,
    questions: [
      {
        q: "١. في أي سنة حدثت غزوة بدر؟",
        answers: ["السنة الأولى من الهجرة","السنة الثانية من الهجرة","السنة الخامسة من الهجرة","السنة العاشرة من الهجرة"],
        correct: 1
      },
      {
        q: "٢. كم كان عدد المسلمين تقريبًا في المعركة؟",
        answers: ["تقريبًا ألف رجل","تقريبًا خمسمائة رجل","تقريبًا ثلاثمائة رجل","تقريبًا مائة رجل"],
        correct: 2
      },
      {
        q: "٣. لماذا خرج المسلمون من المدينة في البداية؟",
        answers: ["لفتح مكة المكرمة","لاعتراض قافلة قريش","لزيارة القبائل المجاورة","للدفاع عن المدينة"],
        correct: 1
      }
    ]
  },
  {
    title: "غزوة أُحد",
    year: "السنة الثالثة من الهجرة",
    text: `<p>وقعت غزوة أُحد في السنة الثالثة للهجرة، قرب جبل أُحد في المدينة المنورة.</p>
<p>كان سببها أنَّ كفار قريش أرادوا الانتقام من المسلمين بعد هزيمتهم في غزوة بدر، فجمعوا جيشًا كبيرًا بقيادة أبو سفيان بن حرب واتجهوا إلى المدينة.</p>
<p>خرج النبي ﷺ مع الصحابة للدفاع عن المسلمين، وكان عدد المسلمين أقل من عدد المشركين. وقبل بدء القتال، وضع النبي ﷺ مجموعة من الرماة على جبل الرماة، وأمرهم ألّا يتركوا أماكنهم مهما حدث.</p>
<p>في بداية المعركة انتصر المسلمون، وبدأ المشركون بالتراجع، لكن بعض الرماة نزلوا من الجبل ظنًّا أن المعركة انتهت، فرآهم خالد بن الوليد وانتهز الفرصة فالتفّ من خلف الجبل وهاجم المسلمين من الخلف، وتغيّر سير المعركة.</p>
<p>وخلال القتال أُصيب النبي ﷺ بجروح، واستشهد عدد من الصحابة، منهم حمزة بن عبد المطلب رضي الله عنه.</p>
<p>ورغم صعوبة المعركة، تعلّم المسلمون درسًا مهمًّا، وهو ضرورة طاعة أوامر النبي ﷺ وعدم مخالفتها. وكانت غزوة أُحد مثالًا على الصبر والثبات والشجاعة.</p>`,
    questions: [
      {
        q: "١. لماذا خرجت قريش لقتال المسلمين في غزوة أُحد؟",
        answers: ["لنشر التجارة","للانتقام بعد غزوة بدر","لعقد صلح مع المسلمين","لأخذ الجزية"],
        correct: 1
      },
      {
        q: "٢. ماذا حدث عندما ترك بعض الرماة أماكنهم؟",
        answers: ["انتصر المسلمون","توقفت المعركة","هاجم المشركون المسلمين من الخلف","أسلم المشركون"],
        correct: 2
      },
      {
        q: "٣. من هو الصحابي الذي استشهد في غزوة أُحد ولُقّب بأسد الله؟",
        answers: ["أبو بكر الصديق","حمزة بن عبد المطلب","عثمان بن عفان","علي بن أبي طالب"],
        correct: 1
      }
    ]
  }
];

let currentAnswered = [];

// ===== LOGO =====
function setLogos(b64) {
  const src = 'data:image/png;base64,' + b64;
  document.getElementById('splashLogo').src = src;
  document.getElementById('menuLogo').src = src;
  document.getElementById('appIcon').href = src;
}

// ===== NAVIGATION =====
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goToMenu() {
  showPage('menuPage');
}

function openStory(idx) {
  const s = stories[idx];
  currentAnswered = [];
  document.getElementById('storyHeaderTitle').textContent = s.title;

  let html = `
    <div class="parchment-section" style="animation-delay:0.1s">
      <h2 class="section-title">${s.title}</h2>
      <div class="ornament">❧ ✦ ❧</div>
      <div class="story-text">${s.text}</div>
    </div>
    <div class="quiz-section" style="animation-delay:0.2s">
      <div class="quiz-title">✦ اختبر معلوماتك ✦</div>
  `;

  s.questions.forEach((q, qi) => {
    html += `<div class="q-block">
      <div class="q-text">${q.q}</div>
      <div class="answers" id="ans_${idx}_${qi}">
        ${q.answers.map((a, ai) => `<button class="ans-btn" onclick="checkAns(${idx},${qi},${ai},${q.correct})">${a}</button>`).join('')}
      </div>
      <div class="feedback" id="fb_${idx}_${qi}"></div>
    </div>`;
  });

  html += `<div class="score-box" id="score_${idx}"></div></div>`;

  document.getElementById('storyContent').innerHTML = html;
  document.getElementById('storyContent').scrollTop = 0;
  showPage('storyPage');
}

function checkAns(storyIdx, qi, ai, correct) {
  const key = `${storyIdx}_${qi}`;
  if (currentAnswered.includes(key)) return;
  currentAnswered.push(key);

  const btns = document.querySelectorAll(`#ans_${storyIdx}_${qi} .ans-btn`);
  const fb = document.getElementById(`fb_${storyIdx}_${qi}`);

  btns.forEach(b => b.disabled = true);
  btns[correct].classList.add('correct');
  fb.classList.add('show');

  if (ai === correct) {
    fb.textContent = '✦ أحسنت! إجابة صحيحة';
    fb.classList.add('correct');
  } else {
    btns[ai].classList.add('wrong');
    fb.textContent = '✗ ليست الإجابة الصحيحة';
    fb.classList.add('wrong');
  }

  const total = stories[storyIdx].questions.length;
  if (currentAnswered.filter(k => k.startsWith(storyIdx+'_')).length === total) {
    const score = currentAnswered.filter(k => {
      const [si, qi2] = k.split('_').map(Number);
      const btns2 = document.querySelectorAll(`#ans_${si}_${qi2} .ans-btn`);
      return Array.from(btns2).some(b => b.classList.contains('correct') && !b.classList.contains('wrong'));
    }).length;
    const scoreEl = document.getElementById(`score_${storyIdx}`);
    const msgs = ['حاول مجددًا 💪','جيد، استمر!','ممتاز! ✦','مثالي! بطل الغزوات ✦'];
    scoreEl.innerHTML = `نتيجتك: ${score} / ${total}<br><small style="font-size:1rem;opacity:0.8">${msgs[score]}</small>`;
    scoreEl.classList.add('show');
  }
}


// Generate bookshelves
const bookColors = ['#8B3A2A','#2E5A3A','#4A3870','#7A5020','#1A4A5A','#6A2A40','#3A5030','#5A4A20','#2A3A5A','#7A3020','#4A6030','#6A4A30','#5A2A4A','#4A5A20','#7A4A20'];
function makeShelf(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '';
  for (let r = 0; r < 12; r++) {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:flex-end;height:52px;border-bottom:6px solid #1a0804;background:rgba(20,8,2,0.5);padding:0 3px;';
    for (let i = 0; i < 8; i++) {
      const book = document.createElement('div');
      const c = bookColors[Math.floor(Math.random()*bookColors.length)];
      const h = 28 + Math.floor(Math.random()*20);
      const w = 10 + Math.floor(Math.random()*12);
      book.style.cssText = `background:${c};height:${h}px;min-width:${w}px;margin:0 1px;border-radius:1px 0 0 0;opacity:${0.6+Math.random()*0.4}`;
      row.appendChild(book);
    }
    el.appendChild(row);
